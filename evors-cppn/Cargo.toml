[package]
name = "evors-cppn"
description = "Evolve images with CPPN-NEAT on evors, rendered and scored on the GPU."
readme = "README.md"
keywords = ["cppn", "neat", "evolutionary", "generative-art", "opengl"]
categories = ["graphics", "algorithms"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evors = { path = "..", version = "0.1.0" }
evors-neat = { path = "../evors-neat", version = "0.1.0" }
rand = "0.9"
rand_chacha = "0.9"
# GL plumbing — versions matched to soap-in-a-tub.
glow = "0.17.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30"
log = "0.4"
# GUI (sub-project C). Manual egui_glow + glutin loop (soap-in-a-tub pattern):
# the CPPN canvas is drawn to the framebuffer, then egui paints on top.
egui = "0.34"
egui_glow = { version = "0.34", features = ["winit"] }
egui-winit = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
rfd = "0.15"

[[bin]]
name = "cppn-gui"
path = "src/bin/gui.rs"
