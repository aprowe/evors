[package]
name = "evors-cppn"
version = "0.1.0"
edition = "2024"

[dependencies]
evors = { path = ".." }
evors-neat = { path = "../evors-neat" }
rand = "0.9"
rand_chacha = "0.9"
# GL plumbing — versions matched to ~/projects/soap-in-a-tub.
glow = "0.17.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30"
log = "0.4"
# GUI (sub-project C). Manual egui_glow + glutin loop (soap-in-a-tub pattern):
# the CPPN canvas is drawn to the framebuffer, then egui paints on top.
egui = "0.34"
egui_glow = { version = "0.34", features = ["winit"] }
egui-winit = "0.34"

[[bin]]
name = "cppn-gui"
path = "src/bin/gui.rs"
